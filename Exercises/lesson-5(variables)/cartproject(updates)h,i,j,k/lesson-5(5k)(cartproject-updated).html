<!DOCTYPE html>
<html>
    <head>
        <title>lesson-5(5k)(cartproject-updated)</title>
        <style>

        </style>
    </head>
    <body>
      <h1> in here simply use shartcuts in a=a-1 instead --,-+=</h1>

        <h1>iam so proud i done it by my self in sake of allah</h1>
        <h1>cart quantity</h1>
        <button onclick="showfun()">show quantity</button>
        <button onclick="addfun()">add to cart</button>
        <button  onclick="twofun()">+2</button>
        <button onclick="threefun()">+3</button>
         <button onclick="fourfun()">+4</button>
          <button onclick="fivefun()">+5</button>
        <button onclick="resetfun()">reset cart</button>
        <button onclick="removefun()">Remove from cart</button>
        <button onclick="removetwoitemfun()">-2</button>
        <button onclick="removethreeitemfun()">-3</button>






        <script>
            
            a=0;
            
            function showfun(){
                console.log("cart quantity:",a);
            }
             function addfun(){
                console.log("cart quantity:",a=a+1);
            }
             function twofun(){
                console.log("cart quantity:",a=a+2);
            }
             function threefun(){
                console.log("cart quantity:",a=a+3);
            }
            function fourfun(){
                console.log("cart quantity:",a+=4);
            }
            function fivefun(){
                console.log("cart quantity:",a+=5);
            }
             function resetfun(){
                 console.log("cart was resetted");
                console.log("cart quantity:",a=0);
            }
              function removefun(){
                console.log("cart quantity:",a--);
            }
            function removetwoitemfun(){
                console.log("cart quantity:",a-=2);
            }
             function removethreeitemfun(){
                console.log("cart quantity:",a-=3);
            }

        </script>
    </body>
</html>
