   <script>
    function removeegg(foods){
      let result=[];
      let eggs=[];
     
      
      for(let i=foods.length-1;i>=0;i--)
      {
       
        if(foods[i]==='egg')
        {
          eggs.push(foods[i])
          if(eggs.length<=2)
          {
          continue;
           }
          }
           result.push(foods[i]);
        
           
       }
       console.log(result.reverse());
      
     

    }
    removeegg(['ham','egg','tomato','white','egg','apple','egg','ice','egg'])
   
 
  </script>
