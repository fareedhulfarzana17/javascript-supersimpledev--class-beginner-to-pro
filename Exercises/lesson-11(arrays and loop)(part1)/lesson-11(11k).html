  <script>
    function countPositive(nums)
    {
      let sum=0;
      for(let i=0;i<nums.length;i++)
      {
        if(nums[i]>=0)
        {
          sum+=1;
        }
      }
      console.log(sum)
    }
    countPositive([2,1,-2,3,-1])
 
  </script>
