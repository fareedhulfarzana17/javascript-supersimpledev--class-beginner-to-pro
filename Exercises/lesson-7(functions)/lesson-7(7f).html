  <p> in these i need to convert temperature with parameter in function if its f  convert to c if its c  convert to f with those formula nmber too thats it</p>


  <script>
    function convertTemperature(degrees,unit){
      if(unit==='C'){
        console.log(((degrees*9/5)+32)+'F')
      }
      else{
        console.log(((degrees-32)*5/9)+'C')
      }
    }
    convertTemperature(86,'F')
     convertTemperature(86,'C')
   

  </script>
