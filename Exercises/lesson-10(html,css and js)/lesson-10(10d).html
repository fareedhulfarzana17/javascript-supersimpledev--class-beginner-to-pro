<html>
  <head>
    <title>lesson-10(10d)</title>
  </head>
  <style>
    .is-toggled{
      background-color: black;
      
      padding:10px 20px;
      width:200px;
      font-weight:bolder;
      cursor:pointer;
      border-radius: 5px;
      border-style: none;
      color:white;


    }
    .default{
       background-color: rgb(24px 24px 24px);
      
      padding:10px 20px;
      width:200px;
      font-weight:bolder;
      border-radius: 5px;
      cursor:pointer;
      border-style: none;

    }
   
  </style>
  <body>
    <p> in thus i just need to create the on and off button with using the method  classList.contains()is class availeble remove it and if ist unavailable add it </p>
    <button class="default" onclick="clickcheck()">
      light on/off
    </button>
    

    <script>
      function clickcheck(){
      let istoggledElement=document.querySelector('.default');
      
      let check=istoggledElement.classList.contains('is-toggled');
      
      if(check===false){
        istoggledElement.classList.add('is-toggled');
        istoggledElement.innerHTML='light on'


      }
      else{
        istoggledElement.classList.remove('is-toggled');
        istoggledElement.innerHTML='light off'

      }
      }

    </script>
  </body>
</html>
