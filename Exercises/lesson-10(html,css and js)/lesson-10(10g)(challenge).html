<html>
  <head>
    <title>lesson-10(10g)(challenge)</title>
  </head>


  <style>
    .is-toggled{
      background-color: black;
      
      padding:10px 20px;
      width:200px;
      font-weight:bolder;
      cursor:pointer;
      border-radius: 5px;
      border-style: none;
      color:white;


    }
    .default{
       background-color: rgb(24px 24px 24px);
      
      padding:10px 20px;
      width:200px;
      font-weight:bolder;
      border-radius: 5px;
      cursor:pointer;
      border-style: none;
      margin:20px;

    }
   
  </style>
  <body>
   <p>this is the continuetion of the previous one in this it have to select only one button at the time </p>
    <button class="default button1" onclick="check('button1')">
      Gaming
    </button>
      <button class="default button2" onclick="check('button2')">
      Music
    </button>
     <button class="default button3" onclick="check('button3')">
      Tech
    </button>
    

    <script>
      function check(value){
         let istoggledElement1=document.querySelector('.button1');
          let istoggledElement2=document.querySelector('.button2');
          let istoggledElement3=document.querySelector('.button3');
          
        if(value==='button1')
        {
         

          istoggledElement1.classList.add('is-toggled');
          istoggledElement2.classList.remove('is-toggled');
          istoggledElement3.classList.remove('is-toggled');
      
         

          }
       
       else if(value==='button2')
       {
        
          istoggledElement2.classList.add('is-toggled');
          istoggledElement3.classList.remove('is-toggled');
          istoggledElement1.classList.remove('is-toggled');
          

       }
       
          else if(value==='button3')
          {
           
          istoggledElement3.classList.add('is-toggled');
          istoggledElement2.classList.remove('is-toggled');
          istoggledElement1.classList.remove('is-toggled');
          };
      
      };
      


    </script>
  </body>
</html>
