<html>

    <title>

  <body>
    in this its a continue of 9d and when we enter the the output have to display too and using event object<br><br>
   <input class="inputClass" placeholder="Name" onkeydown="displayNameonkeydown(event)">
   <button onclick="displayName()">Submit</button>
   <p class="pClass"></p>
  

    <script>
      let inputClassElement=document.querySelector('.inputClass');
      let pClassElement=document.querySelector('.pClass');
      function displayName(){
        pClassElement.innerHTML=`You name is:${inputClassElement.value}`


      }
       function displayNameonkeydown(event){
        if(event.key==='Enter'){
          displayName();

        }

      }
      

    </script>
  </body>
</html>
