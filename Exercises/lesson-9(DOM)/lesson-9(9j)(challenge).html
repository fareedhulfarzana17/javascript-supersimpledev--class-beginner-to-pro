<!DOCTYPE html>
<html>
  <head>
    <title>
      lesson-9(9j)(challenge)(calculatorproject)(update)
    </title>
  </head>
  <p> in this 9j we just need to display the result in the webpage instead of the displaying in the console and display the calculation if its stored in the localstorage after refresh</p>
  <p>from the 7j exercise calculator project  i need to add localstorage using setItem() and getItem() </p>
  <body>
    <p>
     <button onclick="updateCalculation(1)">1</button>
     <button  onclick="updateCalculation(2)">2</button>
    <button  onclick="updateCalculation(3)">3</button>
     </p>
     <p>
     <button onclick="updateCalculation(4)">4</button>
     <button  onclick="updateCalculation(5)">5</button>
    <button  onclick="updateCalculation(6)">6</button>
     </p>
     <p>
     <button onclick="updateCalculation(7)">7</button>
     <button  onclick="updateCalculation(8)">8</button>
    <button  onclick="updateCalculation(9)">9</button>
     </p>
     <p>
     <button  onclick="updateCalculation(0)">0</button>
     <button  onclick="updateCalculation(' + ')">+</button>
      <button  onclick="updateCalculation(' - ')">-</button>
     </p>
     <p>
     <button  onclick="updateCalculation(' * ')">*</button>
     <button  onclick="updateCalculation(' / ')">/</button>
      <button  onclick="resultDisplayfunction(eval(a)),localStorage.setItem('calculation',a)">=</button>
     </p>
     <p> <button  onclick="updateCalculation('.')">.</button>
      </p>
      <p>

       <button  onclick="resultDisplayfunction(a=''),localStorage.setItem('calculation',a)">reset</button>
    
    </p>
    <p class="resultDisplayClass" ></p>
     
     
  </body>
  <script>
    
    let a=localStorage.getItem('calculation') ||'';
    function updateCalculation(value){
      a+=value;
      resultDisplayfunction(a);
      console.log(a);
      resultDisplayfunction(a);

      localStorage.setItem('calculation', a);
      
     
    }
    
    function resultDisplayfunction(a){
      let resultDisplayClassElement=document.querySelector('.resultDisplayClass');
      resultDisplayClassElement.innerHTML=a;
      
      
    }
    resultDisplayfunction(a)
    
  </script>
</html>
