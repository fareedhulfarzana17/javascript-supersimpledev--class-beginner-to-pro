  <body>
    in this i just need to add the input box and button and display the value of the input box when clicking the button below the button<br><br>
   <input class="inputClass" placeholder="Name">
   <button onclick="displayName()">Submit</button>
   <p class="pClass"></p>
  

    <script>
      let inputClassElement=document.querySelector('.inputClass');
      let pClassElement=document.querySelector('.pClass');
      function displayName(){
        pClassElement.innerHTML=`You name is:${inputClassElement.value}`


      }
      

    </script>
  </body>
