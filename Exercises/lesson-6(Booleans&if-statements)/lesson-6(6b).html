      <p>in this lesson-6(6a) we have to craete a variable called hour and store the current hour in 24 hour format and display greeting according to it using else if</p>
      <p> in this lesson-6(6b) we have to display different message from the 6a</p>
        <script>
          const hour=17;
          if(hour>=6 && hour<12){
            console.log("Good Morning honey!! have a nice day!")
          }
          else if(hour>=12 && hour<17){
            console.log("Good afternoon! how was your day? ")
          }
          else{
            console.log("Good night! sweet dream!")
          }
        
        </script>
