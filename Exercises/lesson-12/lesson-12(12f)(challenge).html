<html>
<head>
  
  <title>lesson-12(12f)(challenge)</title>
</head>
<body>
  <button class="addtocart" >Add to cart</button>
  <p class="addedtext"></p>
  <script>
    let addtocartelement=document.querySelector(".addtocart");
    let addedtextelement=document.querySelector(".addedtext");
    let setid;
    addtocartelement.addEventListener('click',buttonchange)
    

    function buttonchange(){
      addedtextelement.innerHTML="Added";
      clearTimeout(setid);
      
      setid=setTimeout(()=>{
        addedtextelement.innerHTML="";


      },2000)
      
      
      
    }
    
      
      

    
   
  </script>
  
</body>                           
</html>
