<html>
  <head>
    <title>to-do-list-with-css(update advacedfunction)</title>

  <style>
   
    .inputClasspractice-2,.dateclass,.inputbutton{
      display:inline-grid;
      grid-template-columns: 150px 30px 10px;
      margin:10px;
      padding:15px;
      align-items: center;
    
     
    }
      .inputbutton{
        text-align: center;
        background-color: green;
        color:white;
        border-style:none;

      }
      
    .date,.add,.butclass{
       display:inline-grid;
      grid-template-columns: 150px 30px 10px;
      margin:10px;
      padding:10px;
      align-items: center;
      
      

    }
      .butclass{
        text-align: center;
        background-color: red;

  <body>
    <p> to-do-list practice-with-css-2</p>

    <button  class="inputbutton js-add-button">add</button>
    <div class="divClass"></div>
    <script>
    //practice 2
        let myArray2=['do work'];
        add();
         let jsaddtbuttonElement=document.querySelector('.js-add-button');
              jsaddtbuttonElement.addEventListener('click',()=>{
                addfunctionpractice2()
              })
        

          function addfunctionpractice2()
            {
              let inputClassElementpractice2=document.querySelector('.inputClasspractice-2');
              let inputClassElementpractice2Value=inputClassElementpractice2.value;
              let divClassElement=document.querySelector('.divClass');
              let dateClassElement=document.querySelector('.dateclass');
             


              myArray2.push(inputClassElementpractice2Value);

              inputClassElementpractice2.value='';
            
              add()
            }
         
          function add()
            {
              let sum=''

              myArray2.forEach((add,index)=>
              
              {
                
                    let divClassElement=document.querySelector('.divClass');
                    let dateClassElement=document.querySelector('.dateclass');
                    let dateclassvalue=dateClassElement.value;


                   
                    let html=`<p class="de">
                      <div class="add">${add}</div>
                      <div class="date">${dateclassvalue}</div>
                      <button onclick="
                      myArray2.splice(${index},1)
                      add()"class="butclass">Delete</button>
                      </p>`;
                    sum=sum+html;
                  
              })

                //     let add=myArray2[i];

                //       <div class="add">${add}</div>

                //       <button onclick="
                //       myArray2.splice(${i},1)
                //       add()"class="butclass">Delete</button>
                //       </p>`;
                //     sum=sum+html;
                //   }
              let divClassElement=document.querySelector('.divClass');
              divClassElement.innerHTML=sum;
           }


    </script>
  </body>
</html>
