  <button onclick="playGame('Heads')">Heads</button>

  <script>
       
        
      
    


        
      let score=JSON.parse(localStorage.getItem('localscore'))||
      {
        wins:0,
        losses:0
      };
      
      function playGame(guess){
        let randomNumber=Math.random();
         let result='';

        console.log(randomNumber);
     randomNumber<0.5?result='Heads':result='Tails';
     console.log(`you chose:${guess}\ncomputer chose:${result}`)
     if(result===guess){
      console.log('you win!!!')
      console.log(`winScore:${score.wins+=1}`)
       console.log(`lossScore:${score.losses}`)

     }
     else{
      console.log('you lose!!!')
      console.log(`winScore:${score.wins}`)
      console.log(`lossScore:${score.losses+=1}`)

     }
     localStorage.setItem('localscore',JSON.stringify(score))
      


      }

      

    </script>
